name: Collect development Expert v2
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/expert-v2.yml"]
permissions:
  contents: write
concurrency:
  group: expert-v2
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download development classifier and collector
        run: |
          curl -L --fail -o /tmp/expert-classifier-v2.js "https://raw.githubusercontent.com/konyan3150-lgtm/kyotei-ai-v8-live/dev-prob-calibration/expert-classifier-v2.js"
          curl -L --fail -o /tmp/collect_expert_v2.mjs "https://raw.githubusercontent.com/konyan3150-lgtm/kyotei-ai-v8-live/dev-prob-calibration/scripts/collect_expert_v2.mjs"
      - name: Preserve pre-close v2 decisions and attach results
        env:
          EXPERT_CLASSIFIER_PATH: /tmp/expert-classifier-v2.js
          EXPERT_OUTPUT_ROOT: ${{ github.workspace }}
        run: node /tmp/collect_expert_v2.mjs
      - name: Commit development evaluations
        run: |
          git add dev/expert-v2.json dev/expert-v2-archive/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save development Expert v2 evaluations"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
