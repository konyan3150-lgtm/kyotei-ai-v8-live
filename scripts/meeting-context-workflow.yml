name: Collect development meeting context

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/meeting-context.yml"]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: meeting-context
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download development collector
        run: curl -L --fail -o /tmp/fetch_meeting_context.mjs "https://raw.githubusercontent.com/konyan3150-lgtm/kyotei-ai-v8-live/dev-prob-calibration/scripts/fetch_meeting_context.mjs"
      - name: Collect official pre-close context
        env:
          MEETING_OUTPUT_ROOT: ${{ github.workspace }}
        run: node /tmp/fetch_meeting_context.mjs
      - name: Preserve daily snapshots
        run: |
          git add dev/meeting-context.json dev/meeting-context-archive/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save development meeting context"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
