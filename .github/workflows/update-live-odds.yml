name: Update live odds

on:
  schedule:
    - cron: "*/6 0-12,22-23 * * *"
    - cron: "3-59/6 0-12,22-23 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_live_odds.php"
      - "scripts/fetch_official_results.mjs"
      - "scripts/fetch_official_previews.mjs"
      - "scripts/build_runtime_payloads.mjs"
      - "scripts/backfill_expert_history.mjs"
      - "scripts/odds-composer.json"
      - "scripts/update_server_predictions.mjs"
      - ".github/workflows/update-live-odds.yml"

permissions:
  contents: write

concurrency:
  group: update-live-odds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Capture validated history baseline
        run: node scripts/verify_prediction_history.mjs dev "$RUNNER_TEMP/prediction-history-baseline.json" --save-baseline
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: scripts/vendor
          key: odds-composer-${{ hashFiles('scripts/odds-composer.json') }}
      - name: Install odds scraper
        env:
          COMPOSER: scripts/odds-composer.json
          COMPOSER_VENDOR_DIR: scripts/vendor
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction
      - name: Fetch near-cutoff trifecta odds
        run: php scripts/fetch_live_odds.php
      - name: Fetch official race results
        # Early in the morning the official pay page can legitimately contain no results yet.
        # Do not let that block fresh odds from being committed for the new day.
        continue-on-error: true
        run: node scripts/fetch_official_results.mjs
      - name: Fetch official preview fallback
        continue-on-error: true
        run: node scripts/fetch_official_previews.mjs
      - name: Build lightweight runtime data
        run: node scripts/build_runtime_payloads.mjs
      - name: Save predictions and settle results
        run: node scripts/update_server_predictions.mjs
      - name: Backfill historical Expert evaluations
        run: node scripts/backfill_expert_history.mjs
      - name: Verify history preservation before commit
        run: node scripts/verify_prediction_history.mjs dev "$RUNNER_TEMP/prediction-history-baseline.json"
      - name: Commit updated odds and predictions
        run: |
          if git diff --quiet -- odds.json dev/odds.json dev/official-results.json dev/official-previews.json dev/racer-aptitude-runtime.json.gz dev/course-stats-runtime.json dev/server-predictions.json dev/server-predictions-index.json dev/server-predictions-archive; then
            echo "No odds or prediction changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds.json dev/odds.json dev/official-results.json dev/official-previews.json dev/racer-aptitude-runtime.json.gz dev/course-stats-runtime.json dev/server-predictions.json dev/server-predictions-index.json dev/server-predictions-archive
          git commit -m "chore: update live odds and predictions"
          # A changed remote head rejects this commit; retry from a fresh checkout next run.
          git push origin HEAD:main
