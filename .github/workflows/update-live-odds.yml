name: Update live odds

on:
  schedule:
    - cron: "*/10 0-12,22-23 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_live_odds.php"
      - "scripts/odds-composer.json"
      - "scripts/update_server_predictions.mjs"
      - ".github/workflows/update-live-odds.yml"

permissions:
  contents: write

concurrency:
  group: update-live-odds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: scripts/vendor
          key: odds-composer-${{ hashFiles('scripts/odds-composer.json') }}
      - name: Install odds scraper
        env:
          COMPOSER: scripts/odds-composer.json
          COMPOSER_VENDOR_DIR: scripts/vendor
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction
      - name: Fetch near-cutoff trifecta odds
        run: php scripts/fetch_live_odds.php
      - name: Save predictions and settle results
        continue-on-error: true
        run: node scripts/update_server_predictions.mjs
      - name: Commit updated odds and predictions
        run: |
          if git diff --quiet -- odds.json dev/odds.json dev/server-predictions.json; then
            echo "No odds or prediction changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds.json dev/odds.json dev/server-predictions.json
          git commit -m "chore: update live odds and predictions"
          git pull --rebase --autostash
          git push
