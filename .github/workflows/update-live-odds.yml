name: Update live odds

on:
  schedule:
    # GitHub often starts scheduled runs late or skips them. Each started run keeps updating every
    # 3 minutes for up to 5.5 h (scripts/update_loop.mjs); these triggers only (re)start that loop.
    # While a run is active, a new trigger waits as the single pending run of the concurrency group.
    # Off the busy :00/:10 minutes, where GitHub drops scheduled runs most (on 10/14 the */10 schedule did not
    # start between 07:00 and 09:53 JST while the hourly :17 recovery schedule did).
    - cron: "2-59/5 0-12,22-23 * * *"
    # 22:07-22:47 JST: (re)start the loop for races closing after 22:00 (the loop stops by itself when there are none,
    # after the last close + result grace, and at 23:45 JST at the latest).
    - cron: "7-47/10 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_live_odds.php"
      - "scripts/fetch_official_results.mjs"
      - "scripts/fetch_official_previews.mjs"
      - "scripts/build_runtime_payloads.mjs"
      - "scripts/backfill_expert_history.mjs"
      - "scripts/odds-composer.json"
      - "scripts/update_server_predictions.mjs"
      - "scripts/update_cycle.sh"
      - "scripts/update_loop.mjs"
      - "scripts/carry_preclose_saves.mjs"
      - "scripts/journal_store.mjs"
      - ".github/workflows/update-live-odds.yml"

permissions:
  contents: write
  actions: write   # dispatch the Pages deploy after each pushed cycle

concurrency:
  group: update-live-odds
  cancel-in-progress: false

jobs:
  update:
    # Production data is written only from main (never from an unmerged branch, also for manual runs).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: scripts/vendor
          key: odds-composer-${{ hashFiles('scripts/odds-composer.json') }}
      - name: Install odds scraper
        env:
          COMPOSER: scripts/odds-composer.json
          COMPOSER_VENDOR_DIR: scripts/vendor
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction
      - name: Test update loop and cycle (no production writes if these fail)
        run: |
          node scripts/test_update_loop.mjs
          node scripts/test_carry_preclose_saves.mjs
          node scripts/test_journal_store.mjs
          node scripts/test_update_cycle.mjs
      # Pre-close purchase journal: purchases origin/main does not hold yet survive into the next run.
      # Stored on the git branch ops/preclose-journal (artifacts are deleted when a run is re-run; caches can be
      # evicted). Any restore failure stops the job here, before any production write; it is never "no purchases".
      - name: Restore pre-close purchase journal
        id: restore
        run: node scripts/journal_store.mjs restore "${{ runner.temp }}/v8-journal/preclose-journal.json"
      - name: Update odds, predictions and results every 3 minutes
        # Each cycle: sync to origin/main, history baseline, odds, official results/previews, runtime data,
        # save predictions and settle, Expert backfill, history verification, commit and push.
        # Data scripts changed on main are used from the next cycle. The loop itself, this workflow and the
        # composer dependencies are fixed for the run: if they change on main, the loop stops and the pending
        # run starts again with them.
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_CARRY_FILE: ${{ runner.temp }}/v8-journal/preclose-journal.json
          LOOP_SUMMARY_FILE: ${{ runner.temp }}/loop-summary.json
        run: |
          echo "RUN_STARTED_AT=$(date -u -Iseconds)" >> "$GITHUB_ENV"
          node scripts/update_loop.mjs
      # Required: save the journal (also after failure, cancellation or timeout) and read it back from origin.
      # Skipped only when the restore failed, so a run that could not read the journal never overwrites it.
      - name: Save pre-close purchase journal
        if: always() && steps.restore.outcome == 'success'
        run: node scripts/journal_store.mjs save "${{ runner.temp }}/v8-journal/preclose-journal.json"
      # Night handover to the morning wake chain (wake-update.yml starts this workflow at 07:00 JST without relying on
      # `schedule`). Only between 21:00 and 04:59 JST; extra wakers exit as duplicates. A failed handover is reported
      # as an error annotation but does not fail this run (its updates are already saved); the fallback schedules of
      # wake-update.yml remain.
      - name: Hand over to the morning wake chain
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Asia/Tokyo date +%H)
          if [ "$h" -ge 21 ] || [ "$h" -lt 5 ]; then
            if timeout 60 gh workflow run wake-update.yml --ref main; then echo "::notice title=wake handover::wake-update.yml dispatched at $(TZ=Asia/Tokyo date -Iseconds)";
            else echo "::error title=wake handover failed::could not dispatch wake-update.yml; its fallback schedules remain"; fi
          else
            echo "not night (JST hour $h): no handover"
          fi
      # Midday hand-over: the loop stops at its 5.5 h limit (about 12:19 JST after the 07:00 start) and its pending
      # successor can be replaced in the shared concurrency group (10/20-10/23: ~2 h without odds updates). Only after a
      # normal stop at the run time limit (ok, no pending journal), same JST date, before 21:00 JST, at most 3 per day,
      # this dispatches handoff-update.yml, which waits for this run to finish successfully and for an idle group and
      # then starts the next update. A failed decision or dispatch is an annotation; this run keeps its result.
      - name: Hand over at the run time limit
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HANDOFF_WORKFLOW: handoff-update.yml
          LOOP_SUMMARY_FILE: ${{ runner.temp }}/loop-summary.json
        run: node ops/wake-chain/handoff_gate.mjs
