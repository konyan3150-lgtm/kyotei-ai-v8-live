name: Confidence concentration validation
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/confidence-concentration-validation.yml"
      - "scripts/validate_confidence_concentration.mjs"
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate_confidence_concentration.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add confidence-concentration-result.json
          git diff --cached --quiet || (git commit -m "data: confidence concentration validation" && git push)
