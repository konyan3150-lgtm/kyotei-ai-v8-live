name: Daily racer aptitude update

on:
  schedule:
    # 22:15 JST = 13:15 UTC. Yesterday is used so all races have time to settle.
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: racer-aptitude-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Parser self-test
        run: node scripts/backfill_racer_aptitude.mjs --self-test
      - name: Add newly settled race results
        run: |
          cp racer-aptitude.json racer-aptitude.before.json
          # Temporary network/API errors are retried and do not become a failure email immediately.
          for attempt in 1 2 3; do
            cp racer-aptitude.before.json racer-aptitude.json
            if node scripts/backfill_racer_aptitude.mjs --input racer-aptitude.json --output racer-aptitude.json --min-races 1 --min-rows 1; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Temporary update failure (attempt $attempt/3); retrying..."
              sleep 60
            fi
          done
          echo "::error::Racer aptitude update failed 3 times. Manual investigation required."
          exit 1
      - name: Validate and sync development copy
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('racer-aptitude.before.json'));
          const after=JSON.parse(fs.readFileSync('racer-aptitude.json'));
          const starts=x=>Object.values(x.racers||{}).reduce((s,r)=>s+Number(r.o?.[0]||0),0);
          if(starts(after)<starts(before)) throw Error('aptitude starts decreased');
          if(after.history_end && before.history_end && String(after.history_end)<String(before.history_end)) throw Error('history_end moved backwards');
          console.log({before:before.history_end,after:after.history_end,added:starts(after)-starts(before),backfill:after.backfill});
          NODE
          cp racer-aptitude.json dev/racer-aptitude.json
      - name: Commit new aptitude data
        run: |
          rm -f racer-aptitude.before.json
          if git diff --quiet -- racer-aptitude.json dev/racer-aptitude.json; then echo "No new settled results"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add racer-aptitude.json dev/racer-aptitude.json
          git commit -m "data: update racer aptitude"
          git pull --rebase origin main
          git push origin main
