name: Update next-day race program

on:
  schedule:
    # Run after the day's boat races have finished (JST).
    # 22:05 is the primary fetch; 23:05 retries if official next-day data is still incomplete.
    - cron: "5 13,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_tomorrow.py"
      - "scripts/test_fetch_tomorrow.py"
      - "scripts/commit_paths.sh"
      - "scripts/fetch_tide.py"
      - ".github/workflows/update-tomorrow.yml"

permissions:
  contents: write

concurrency:
  group: update-next-day-program
  cancel-in-progress: true

jobs:
  update:
    # Production data is written only from main (never from an unmerged branch, also for manual runs).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Test next-day program parser (offline fixtures)
        run: python scripts/test_fetch_tomorrow.py
      - name: Fetch official next-day program
        run: |
          python scripts/fetch_tomorrow.py dev/tomorrow.json
          cp dev/tomorrow.json tomorrow.json
      - name: Fetch JMA astronomical tide table
        run: python scripts/fetch_tide.py dev/tide.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test commit retry
        run: node scripts/test_commit_paths.mjs
      - name: Commit changed program
        # Retries a push rejected by other workflows' pushes from the latest origin/main (only these files are put back).
        run: |
          bash scripts/commit_paths.sh "chore: update next-day race program" dev/tomorrow.json tomorrow.json dev/tide.json
