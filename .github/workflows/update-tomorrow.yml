name: Update next-day race program

on:
  schedule:
    # Run after the day's boat races have finished (JST).
    # 22:05 is the primary fetch; 23:05 retries if official next-day data is still incomplete.
    - cron: "5 13,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-next-day-program
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Fetch official next-day program
        run: |
          python scripts/fetch_tomorrow.py dev/tomorrow.json
          cp dev/tomorrow.json tomorrow.json
      - name: Commit changed program
        run: |
          if git diff --quiet -- dev/tomorrow.json tomorrow.json; then
            echo "Next-day program is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/tomorrow.json tomorrow.json
          git commit -m "chore: update next-day race program"
          git push
