name: Recover pending race results
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
    - cron: "5,20,35,50 13-14 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/settle-pending-results.yml"
      - "scripts/settle_pending_results.mjs"
permissions:
  contents: write
concurrency:
  group: update-live-odds
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest saved predictions
        run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reconcile all pending dates with official payouts
        run: node scripts/settle_pending_results.mjs
      - name: Commit result updates
        run: |
          git add dev/server-predictions.json dev/server-predictions-index.json dev/server-predictions-archive/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Settle pending races from official historical results"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
